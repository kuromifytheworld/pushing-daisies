version: "3.9"

services:
  neo4j:
    image: neo4j:5.20-community
    container_name: pushing-daisies-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/pushingdaisies
      NEO4J_PLUGINS: '["graph-data-science"]'
      NEO4J_dbms_memory_heap_max__size: 1G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

  api:
    build: ./backend
    container_name: pushing-daisies-api
    ports:
      - "8000:8000"
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: pushingdaisies
    depends_on:
      - neo4j
    volumes:
      - ./backend:/app

volumes:
  neo4j_data:
  neo4j_logs:
